name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts && npm rebuild

      - name: Test workspace behavior
        run: npm test

      - name: Build Nimbo installer (Windows x64)
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ($env:WIN_CSC_LINK) {
            npm run build:signed -- --publish never
          } else {
            Write-Host 'No code-signing certificate configured. This build will be unsigned.'
            npm run build -- --publish never
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:WIN_CSC_LINK) {
            $targets = @('dist/win-unpacked/Nimbo.exe') + @(Get-ChildItem dist/*-Setup-*.exe | Select-Object -ExpandProperty FullName)
            foreach ($target in $targets) {
              $signature = Get-AuthenticodeSignature $target
              if ($signature.Status -ne 'Valid') {
                throw "Invalid Authenticode signature: $target ($($signature.Status))"
              }
            }
          }

      - name: Verify silent installation and in-place update
        shell: pwsh
        run: ./build/smoke-update.ps1

      - name: Checksum installer
        shell: pwsh
        run: |
          Get-ChildItem dist/*-Setup-*.exe | ForEach-Object {
            $digest = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$digest  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nimbo-windows-x64
          path: |
            dist/*-Setup-*.exe
            dist/*-Setup-*.exe.sha256
            dist/*-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Nimbo ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/*-Setup-*.exe
            dist/*-Setup-*.exe.sha256
            dist/*-Setup-*.exe.blockmap
            dist/latest.yml
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
